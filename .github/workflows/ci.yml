name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore ChapanakitCare.sln --locked-mode
      - name: Build
        run: dotnet build ChapanakitCare.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test ChapanakitCare.sln --no-build --configuration Release
